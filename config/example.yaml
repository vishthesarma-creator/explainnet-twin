schema_version: 1
data_dir: /var/tmp/explainnet/data
runtime_dir: /var/tmp/explainnet/run
agent_socket: /run/explainnet/agent.sock
host: 127.0.0.1
port: 8765
topology_file: topology.yaml
traffic_profiles_file: traffic.yaml
objective:
  max_rtt_ms: 100
  max_loss_fraction: 0.02
telemetry:
  sample_interval_s: 1
  window_s: 10
  min_coverage_fraction: 0.65
  stale_after_s: 30
  consecutive_windows: 2
  recovery_windows: 2
  recovery_fraction: 0.9
  max_utilization_fraction: 0.9
  min_delivered_demand_fraction: 0.8
  demand_floor_bps: 100000
  reference_rtt_margin_ms: 15
  max_cpu_busy_fraction: 0.95
  max_memory_used_fraction: 0.95
laboratory_policy:
  permitted_actions: []
  auto_repair_enabled: false
